# The Samba container's config. The share paths are inside the container; the
# Compose file mounts the real folders there. Each share needs the Samba user's login (no guests).

[global]
   server role = standalone server
   # No netbios name: on the host network it's the host's own name, so every client sees the same
   # server. NetBIOS stays on (nmbd, and SMB on 139 as well as 445), for Windows clients that find
   # the server through it.
   server string = %h server (Samba, Ubuntu)
   map to guest = Bad User
   # The host's Avahi announces the server (avahi/smb.service); smbd can't reach it from here.
   multicast dns register = no

   # smbd and nmbd log to stdout (--debug-stdout), so to `docker logs samba`.
   log level = 1

   # No printers.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # For Macs (other clients don't use these): Finder metadata and resource forks go into
   # extended attributes, so Macs stop writing `._` files, and existing ones are converted as
   # they're read. catia maps the characters macOS allows in names but Windows doesn't.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:delete_empty_adfiles = yes
   fruit:wipe_intentionally_left_blank_rfork = yes

# SAMBA_SHARE_DIR from .env. For another share, mount its folder under /shares in
# compose.override.yaml and copy this block with a new name and path.
[share]
   comment = Samba on Ubuntu
   path = /shares/share
   read only = no
